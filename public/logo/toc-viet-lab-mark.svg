<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D6A84F"/>
      <stop offset="50%" style="stop-color:#F0C76A"/>
      <stop offset="100%" style="stop-color:#C56A3A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#goldGradient)" opacity="0.1"/>
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#goldGradient)" stroke-width="2"/>
  
  <!-- Hair strand swirl design -->
  <path d="M50 18 
           C65 18, 78 28, 78 45 
           C78 58, 68 65, 55 65
           C42 65, 35 58, 35 48
           C35 40, 42 35, 52 35
           C60 35, 65 40, 65 48
           C65 54, 60 58, 52 58" 
        fill="none" 
        stroke="url(#goldGradient)" 
        stroke-width="4" 
        stroke-linecap="round"
        filter="url(#glow)"/>
  
  <!-- Secondary flowing strand -->
  <path d="M30 55
           C35 65, 45 72, 58 72
           C70 72, 80 65, 82 52" 
        fill="none" 
        stroke="url(#goldGradient)" 
        stroke-width="3" 
        stroke-linecap="round"
        opacity="0.7"/>
  
  <!-- Accent dot -->
  <circle cx="50" cy="82" r="4" fill="url(#goldGradient)"/>
</svg>
